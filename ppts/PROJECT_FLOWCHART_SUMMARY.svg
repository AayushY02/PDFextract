    .dash { fill:#ffffff; stroke:#41637a; stroke-width:2; stroke-dasharray:8 6; }
    .hl { fill:#ffef78; stroke:#41637a; stroke-width:2; }
    .t { font-family:'Yu Gothic','Meiryo',sans-serif; font-size:28px; fill:#111; }
    .m { font-family:'Yu Gothic','Meiryo',sans-serif; font-size:22px; fill:#111; }
    .s { font-family:'Yu Gothic','Meiryo',sans-serif; font-size:20px; fill:#111; }
  </style>

  <line x1="120" y1="85" x2="120" y2="860" class="line"/>

